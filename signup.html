<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix - Sign Up</title>
  <link rel="stylesheet" href="style/style.css" />
  <link rel="icon" href="img/logo.png" />
</head>

<body>
  <div class="upper">
    <div class="logo">
      <a href="#">
        <img src="img/Netflix-Logo.png" class="img-logo" />
      </a>
    </div>

    <div class="login-div">
      <form class="login" id="signupForm">
        <h1>Create Account</h1>

        <!-- Name -->
        <div class="input-text">
          <input type="text" id="inputName" name="username" placeholder="Full Name" />
          <p id="warningName" style="display:none; color:#e50914; font-size:14px; margin-top:5px;">
            Please enter your name.
          </p>
        </div>

        <!-- Email -->
        <div class="input-text">
          <input type="text" id="inputEmail" name="email" placeholder="Email or phone number" />
          <p id="warningEmail" style="display:none; color:#e50914; font-size:14px; margin-top:5px;">
            Please enter a valid email or phone.
          </p>
        </div>

        <!-- Password -->
        <div class="input-text">
          <input type="password" id="inputPassword" name="password" placeholder="Password" />
          <p id="warningPassword" style="display:none; color:#e50914; font-size:14px; margin-top:5px;">
            Password must be 4–60 characters.
          </p>
        </div>

        <div>
          <button class="signup-button" type="button">Sign Up</button>
        </div>

        <div class="new-members">
          Already have an account?
          <a href="index.html" class="signup-link">Sign in now</a>.
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div class="bottom">
    <div class="bottom-width">
      Questions? Call
      <a href="tel:1-844-542-4813" class="tel-link">1-844-542-4813</a>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
